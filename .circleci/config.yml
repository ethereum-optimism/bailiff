version: '2.1'
orbs:
  go: circleci/go@1.12.0

jobs:
  build:
    executor:
      name: go/default
      tag: '1.23.2'
    steps:
      - checkout
      - run:
          name: Check mod tidy
          command: |
            go mod tidy
            git diff --quiet --exit-code
      - go/test:
          covermode: atomic
          no_output_timeout: 15m
          race: true
          timeout: 15m
          verbose: true

  release:
    executor:
      name: go/default
      tag: '1.23.2'
    steps:
      - checkout
      - run:
          name: Install goreleaser
          command: go install github.com/goreleaser/goreleaser/v2@latest
      - run:
          name: Run goreleaser
          command: |
            goreleaser release --clean -f ./.goreleaser.yml

workflows:
  main:
    jobs:
      - build

  release:
    jobs:
      - release:
          filters:
            tags:
              only: /^v[0-9]+(.*)/
            branches:
              ignore: /.*/
          context:
            - oplabs-gcr-release
